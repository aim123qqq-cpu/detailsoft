name: Mobile

# Checks and builds the native app (mobile/) on Linux, where the C++ part of React Native has no
# path-length limit. The APK and AAB are unsigned: the owner signs them locally with the Google Play
# upload key (node scripts/sign-mobile.mjs), so the key never leaves the owner's machine.
# The latest build is attached to the "mobile-ci" pre-release.
on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - src/shared/**
      - src/types.ts
      - src/offline/**
      - src/apiError.ts
      - src/platform.ts
      - .github/workflows/mobile.yml
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Types and lint
        run: |
          npx tsc --noEmit
          npx expo lint
      - name: Native project
        run: npx expo prebuild --platform android --no-install
      - name: Unsigned APK and AAB
        working-directory: mobile/android
        env:
          DF_UNSIGNED: '1'
        run: ./gradlew --console=plain assembleRelease bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Attach to the mobile-ci pre-release
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ../DetailFlow-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../DetailFlow-unsigned.aab
          notes="DetailFlow ${version}, build ${GITHUB_SHA::7}. Unsigned: sign locally with node scripts/sign-mobile.mjs."
          gh release view mobile-ci >/dev/null 2>&1 || gh release create mobile-ci --prerelease --title "Mobile CI build" --notes "$notes"
          gh release edit mobile-ci --notes "$notes"
          gh release upload mobile-ci ../DetailFlow-unsigned.apk ../DetailFlow-unsigned.aab --clobber
