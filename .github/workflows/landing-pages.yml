name: Landing on GitHub Pages

# Publishes public/landing22 to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/. The repository variable LANDING_APP_URL, when set,
# is where the page's "Открыть DetailFlow" buttons lead; without it they stay on the page's demo.
on:
  push:
    branches: [main]
    paths:
      - public/landing22/**
      - scripts/build-landing-pages.mjs
      - .github/workflows/landing-pages.yml
  workflow_dispatch:

concurrency:
  group: landing-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the public copy
        env:
          APP_URL: ${{ vars.LANDING_APP_URL }}
        run: node scripts/build-landing-pages.mjs site
      - name: Publish to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Landing from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
