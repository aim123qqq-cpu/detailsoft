<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>DetailFlow · Админка</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --ground: #0b1016; --surface: #121920; --raised: #1a232c; --line: #26313b; --ink: #eef1f3; --muted: #95a2af; --soft: #6f7c87;
      --accent: #ff7939; --ok: #36c996; --warn: #f2c14e; --bad: #e95d5d; --bar: #3987e5; --bar2: #ff7939; --bar3: #36c996; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { width: min(100% - 32px, 1180px); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    h1 small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
    h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    button { min-height: 40px; padding: 0 14px; border: 1px solid #394550; border-radius: 10px; color: var(--ink); background: var(--raised); font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { border: 0; color: #1b110d; background: var(--accent); }
    a { color: var(--accent); }
    .grid { display: grid; gap: 14px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
    .card { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); min-width: 0; }
    .kpi strong { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi span { color: var(--muted); font-size: 13px; }
    .kpi small { display: block; margin-top: 4px; color: var(--soft); font-size: 12px; }
    .two { grid-template-columns: 1.6fr 1fr; margin-bottom: 14px; }
    @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
    .chart svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .rows { display: grid; gap: 8px; }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .row span { color: var(--muted); }
    .row b { font-variant-numeric: tabular-nums; text-align: right; }
    .meter { height: 6px; margin-top: 4px; border-radius: 3px; background: var(--raised); overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--ok); }
    .meter i.warn { background: var(--warn); } .meter i.bad { background: var(--bad); }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill.ok { color: var(--ok); background: rgba(54,201,150,.14); } .pill.bad { color: var(--bad); background: rgba(233,93,93,.14); }
    .table { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-size: 12px; font-weight: 700; }
    th:first-child, td:first-child { text-align: left; white-space: normal; }
    td small { display: block; color: var(--soft); font-size: 12px; }
    .muted { color: var(--muted); }
    .login { max-width: 420px; margin: 12vh auto 0; display: grid; gap: 14px; text-align: center; }
    .code { display: flex; justify-content: center; gap: 6px; font: 800 30px/1 Manrope, monospace; letter-spacing: .08em; }
    .error { color: var(--bad); }
    footer { margin-top: 18px; color: var(--soft); font-size: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }
    .form { display: grid; gap: 12px; align-content: start; }
    .form label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .form input:not([type=radio]):not([type=checkbox]), .form textarea, .form select { width: 100%; padding: 10px 12px; border: 1px solid #33404d; border-radius: 10px; color: var(--ink); background: #0c1218; font: inherit; }
    .form .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; }
    .form #survey-fields { display: grid; gap: 10px; }
    .form #survey-fields[hidden], .form #center-field[hidden] { display: none; }
    .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
    .segmented label { display: block; cursor: pointer; }
    .segmented input { position: absolute; opacity: 0; }
    .segmented span { display: inline-block; padding: 8px 14px; border: 1px solid #394550; border-radius: 10px; color: var(--ink); }
    .segmented input:checked + span { border-color: var(--accent); color: var(--accent); background: rgba(255,121,57,.08); }
    .segmented input:focus-visible + span { outline: 2px solid var(--accent); }
    .actions { display: flex; gap: 8px; }
    .preview { display: grid; gap: 8px; padding: 14px; border: 1px dashed rgba(255,121,57,.5); border-radius: 12px; }
    .preview p { margin: 0; white-space: pre-line; }
    .ok-text { color: var(--ok); font-weight: 700; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--raised); }
    .comment { margin: 8px 0 0; padding: 10px; border-radius: 10px; background: var(--raised); white-space: pre-line; }
    .comment small { display: block; margin-top: 4px; color: var(--soft); }
    .pill.warn { color: var(--warn); background: rgba(242,193,78,.14); }
    .pill.info { color: #7fb4f2; background: rgba(57,135,229,.16); } .pill.soft { color: var(--muted); background: var(--raised); }
    .period { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .period-dates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .period-dates[hidden] { display: none; }
    .period-dates label { color: var(--muted); font-size: 13px; }
    .period-dates input { min-height: 40px; padding: 0 10px; border: 1px solid #33404d; border-radius: 10px; color: var(--ink); background: #0c1218; font: inherit; color-scheme: dark; }
    .kpi-link { color: inherit; text-decoration: none; } .kpi-link:hover { border-color: var(--accent); }
    .request-hint { margin: 0 0 10px; font-size: 13px; }
    .request-group { border-top: 1px solid var(--line); padding: 10px 0; }
    .request-group summary { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
    .request-count { font-variant-numeric: tabular-nums; font-weight: 700; }
    .request-group[open] summary { margin-bottom: 8px; }
    button.link { min-height: 0; padding: 0; border: 0; background: none; color: var(--accent); font-size: inherit; font-weight: 600; }
    .center-actions { display: flex; gap: 12px; margin-top: 2px; }
    #centers-table th .sort { white-space: normal; }
    .funnel { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .funnel b { color: var(--ink); } .funnel i { font-style: normal; color: var(--soft); }
    .center-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 10px; }
    .center-filters input[type=search] { flex: 1 1 200px; width: auto; min-width: 180px; }
    .center-filters select { flex: 0 1 220px; width: auto; }
    .center-filters .check { font-size: 13px; white-space: nowrap; }
    button.sort { min-height: 0; padding: 2px 0; border: 0; background: none; color: inherit; font: inherit; white-space: nowrap; }
    th[aria-sort="ascending"] button.sort, th[aria-sort="descending"] button.sort { color: var(--accent); }
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    td small.stuck { color: var(--warn); }
    tr.skipped td { opacity: .6; }
    td b { font-weight: 700; }
    .event-who { margin: 4px 0 0; color: var(--ink); font-size: 13px; }
    .journal-find { margin-top: 10px; display: flex; grid-template-columns: none; }
    .journal-find select { max-width: 280px; } .journal-find input { flex: 1; min-width: 200px; }
    .journal-more { width: 100%; margin-top: 12px; } .journal-more[hidden] { display: none; }
    .journal-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
    .journal-note { margin: 10px 0 4px; font-size: 12px; }
    .journal { display: grid; }
    .event { padding: 12px 0 12px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
    .event.warn { border-left-color: var(--warn); } .event.bad { border-left-color: var(--bad); }
    .event-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
    .event-head time { color: var(--soft); font-size: 12px; font-variant-numeric: tabular-nums; }
    .event-meaning { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .event details { margin-top: 6px; font-size: 12px; color: var(--soft); }
    .event summary { cursor: pointer; }
    .event pre { margin: 6px 0 0; padding: 10px; border-radius: 8px; background: #0c1218; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
<main id="app"><p class="muted">Загрузка…</p></main>
<script>
// The DetailFlow service owner's admin: counts across centers and the server's health. Sign-in goes through
// the same Telegram/MAX bot; only accounts listed on the server (scripts/platform-admin.mjs) get in.
const app = document.getElementById('app');
const TOKEN_KEY = 'detailflow.admin';
const token = () => { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } };
const setToken = (value) => { try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch {} };
const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (value) => Number(value ?? 0).toLocaleString('ru-RU');
const bytes = (value) => value >= 1024 ** 3 ? `${(value / 1024 ** 3).toFixed(1)} ГБ` : `${Math.round(value / 1024 ** 2)} МБ`;
const when = (iso) => iso ? new Date(iso.includes('T') ? iso : `${iso.replace(' ', 'T')}Z`).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' }) : '—';
const duration = (seconds) => seconds >= 86400 ? `${Math.floor(seconds / 86400)} дн ${Math.floor(seconds % 86400 / 3600)} ч` : seconds >= 3600 ? `${Math.floor(seconds / 3600)} ч ${Math.floor(seconds % 3600 / 60)} мин` : `${Math.floor(seconds / 60)} мин`;
let refreshTimer = null;
let centersCache = [];
let centersAll = [];

async function api(path, init = {}) {
  const response = await fetch(path, { ...init, headers: { 'content-type': 'application/json', ...(token() ? { authorization: `Bearer ${token()}` } : {}), ...(init.headers ?? {}) } });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(body.error?.message ?? `Ошибка ${response.status}`); error.status = response.status; throw error; }
  return body;
}

async function showLogin(message = '') {
  clearInterval(refreshTimer);
  const providers = (await api('/api/auth/providers').catch(() => ({ items: [] }))).items;
  app.innerHTML = `<section class="login card">
    <h1>DetailFlow · Админка</h1>
    <p class="muted">Вход для владельца сервиса: подтвердите в боте, как при обычном входе.</p>
    ${message ? `<p class="error">${esc(message)}</p>` : ''}
    ${providers.length ? providers.map((p) => `<button class="primary" data-provider="${esc(p.provider)}">Войти через ${esc(p.title)}</button>`).join('') : '<p class="error">Боты сейчас недоступны — вход невозможен.</p>'}
  </section>`;
  app.querySelectorAll('[data-provider]').forEach((button) => button.addEventListener('click', () => startLogin(button.dataset.provider)));
}

async function startLogin(provider) {
  let login;
  try { login = await api('/api/auth/login-requests', { method: 'POST', body: JSON.stringify({ provider }) }); }
  catch (error) { return showLogin(error.message); }
  app.innerHTML = `<section class="login card">
    <h1>Подтвердите в боте</h1>
    <div class="code">${esc(login.shortCode)}</div>
    ${login.deepLink ? `<a class="primary" href="${esc(login.deepLink)}" target="_blank" rel="noopener"><button class="primary" style="width:100%">Открыть бота</button></a>` : ''}
    <p class="muted" id="login-status">Ждём подтверждения…</p>
    <button id="cancel">Отмена</button>
  </section>`;
  let stopped = false;
  document.getElementById('cancel').addEventListener('click', () => { stopped = true; showLogin(); });
  const headers = { 'x-login-secret': login.pollSecret };
  while (!stopped) {
    await new Promise((done) => setTimeout(done, 1500));
    let status;
    try { status = await api(`/api/auth/login-requests/${login.id}`, { headers }); } catch { continue; }
    if (status.status === 'CONFIRMED') {
      try {
        const session = await api(`/api/admin/login-requests/${login.id}/session`, { method: 'POST', headers });
        setToken(session.token);
        return showDashboard();
      } catch (error) { return showLogin(error.status === 403 ? 'Этот аккаунт не владелец сервиса DetailFlow.' : error.message); }
    }
    if (['DENIED', 'EXPIRED', 'CONSUMED'].includes(status.status)) return showLogin(status.status === 'DENIED' ? 'Вход отклонён в боте.' : 'Время входа истекло, начните заново.');
  }
}

const CHART_SERIES = [['bookings', 'записи', 'var(--bar)'], ['orders', 'заказы', 'var(--bar2)'], ['closed', 'выдано автомобилей', 'var(--bar3)'], ['documents', 'акты', 'var(--warn)']];

/** Short label of a chart step: an hour, a day, the first day of a week, a month. */
function stepLabel(key, granularity) {
  if (granularity === 'hour') return `${key.slice(11)}:00`;
  if (granularity === 'month') return `${key.slice(5, 7)}.${key.slice(2, 4)}`;
  return `${key.slice(8)}.${key.slice(5, 7)}`;
}

/** Grouped bars across the chosen period; a plain SVG, no library. */
function activityChart(points, granularity) {
  const width = 640, height = 180, pad = 22, groupWidth = (width - pad) / Math.max(1, points.length);
  const max = Math.max(1, ...points.flatMap((point) => CHART_SERIES.map(([key]) => point[key])));
  const barWidth = Math.max(1.5, (groupWidth - 2) / CHART_SERIES.length);
  const bars = points.map((point, index) => CHART_SERIES.map(([key, label, color], s) => {
    const h = (point[key] / max) * (height - pad - 6);
    return h ? `<rect x="${pad + index * groupWidth + 1 + s * barWidth}" y="${height - pad - h}" width="${Math.max(1, barWidth - 0.5)}" height="${h}" rx="1.5" fill="${color}"><title>${esc(stepLabel(point.day, granularity))}: ${label} — ${point[key]}</title></rect>` : '';
  }).join('')).join('');
  const every = Math.max(1, Math.ceil(points.length / 8));
  const labels = points.map((point, index) => index % every === 0 ? `<text x="${pad + index * groupWidth}" y="${height - 6}" fill="var(--soft)" font-size="10">${esc(stepLabel(point.day, granularity))}</text>` : '').join('');
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Записи, заказы, выданные автомобили и акты за период">
    <line x1="${pad}" x2="${width}" y1="${height - pad}" y2="${height - pad}" stroke="var(--line)"/>
    <text x="0" y="12" fill="var(--soft)" font-size="10">${max}</text>${bars}${labels}</svg>`;
}

function requestsChart(series) {
  if (series.length < 2) return '<p class="muted">Период слишком короткий для графика.</p>';
  const width = 640, height = 120, max = Math.max(1, ...series.map((step) => Math.max(step.people, step.other)));
  const stepWidth = width / (series.length - 1);
  const y = (value) => (height - 14 - (value / max) * (height - 24)).toFixed(1);
  const line = (key) => series.map((step, index) => `${(index * stepWidth).toFixed(1)},${y(step[key])}`).join(' ');
  const errors = series.map((step, index) => step.errors ? `<circle cx="${index * stepWidth}" cy="${y(step.people)}" r="3" fill="var(--bad)"><title>${step.errors} ошибок сервера</title></circle>` : '').join('');
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Запросы за период">
    <polyline points="${line('other')}" fill="none" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="3 3" stroke-linejoin="round"/>
    <polyline points="${line('people')}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round"/>${errors}
    <text x="0" y="10" fill="var(--soft)" font-size="10">${num(max)}</text></svg>`;
}

const meter = (share) => `<div class="meter"><i class="${share > 0.9 ? 'bad' : share > 0.75 ? 'warn' : ''}" style="width:${Math.min(100, Math.round(share * 100))}%"></i></div>`;

const PERIODS = { hour: 'Час', today: 'Сегодня', yesterday: 'Вчера', '7d': '7 дней', '30d': '30 дней', '90d': '90 дней', '365d': 'Год', all: 'Всё время', custom: 'Свои даты' };
const readPeriod = () => { try { return JSON.parse(localStorage.getItem('detailflow.admin.period')) ?? { preset: '30d' }; } catch { return { preset: '30d' }; } };
let period = readPeriod();
const keepPeriod = () => { try { localStorage.setItem('detailflow.admin.period', JSON.stringify(period)); } catch {} };
const periodQuery = () => period.preset === 'custom' && period.from && period.to ? `from=${period.from}&to=${period.to}` : `preset=${period.preset === 'custom' ? '30d' : period.preset}`;

function periodBar(stats) {
  return `<section class="card period" data-testid="period-bar">
    <div class="segmented">${Object.entries(PERIODS).map(([value, label]) => `<label><input type="radio" name="period" value="${value}" ${period.preset === value ? 'checked' : ''}><span>${label}</span></label>`).join('')}</div>
    <form id="period-dates" class="period-dates" ${period.preset === 'custom' ? '' : 'hidden'}>
      <label>с <input type="date" name="from" value="${esc(period.from ?? stats.period.from)}" data-testid="period-from"></label>
      <label>по <input type="date" name="to" value="${esc(period.to ?? stats.period.to)}" data-testid="period-to"></label>
      <button class="primary" data-testid="period-apply">Показать</button>
    </form>
  </section>`;
}

/** «было 4»: the same length of time just before, to see the direction. */
const before = (now, was) => period.preset === 'all' ? '' : now === was ? ' · как и раньше' : ` · было ${num(was)}`;
const PROVIDER_NAMES = { telegram: 'Telegram', max: 'MAX', email: 'email' };
const STATUS_TONES = { active: 'ok', cooling: 'warn', gone: 'bad', idle: 'soft' };
const CLIENT_NAMES = { app: 'Приложение', site: 'Сайт', both: 'Оба' };
const GROUP_HINTS = {
  work: 'Настоящая работа: люди открывают разделы и что-то меняют. Приложение само обновляет открытые экраны, поэтому просмотры идут и без нажатий.',
  signin: 'Экран входа. «Ждёт подтверждения» — это экран опрашивает сервер раз в полторы секунды, пока человек в боте: таких запросов всегда много.',
  site: 'Открытие сайта и загрузка его файлов: посетители лендинга и обновление приложения.',
  admin: 'Эта страница сама себя обновляет: журнал раз в 2 секунды. Людей здесь нет, поэтому в «запросы от людей» не входит.',
  service: 'Сервер проверяет сам себя при обновлениях. На работу не влияет.',
  unknown: 'Роботы в интернете перебирают адреса на всех сайтах подряд. Обычное дело, защита от этого не требует действий.'
};
const openGroups = new Set(['work']);

function requestsCard(breakdown) {
  const rows = breakdown.groups.map((group) => `<details class="request-group" data-group="${esc(group.id)}" ${openGroups.has(group.id) ? 'open' : ''}>
    <summary><b>${esc(group.title)}</b><span class="request-count">${num(group.requests)}${group.serverErrors ? ` <span class="pill bad">сбоев: ${num(group.serverErrors)}</span>` : ''}</span></summary>
    <p class="muted request-hint">${esc(GROUP_HINTS[group.id] ?? '')}</p>
    <div class="table"><table><thead><tr><th>Что происходит</th><th>Запросов</th><th>Отказов</th><th>Сбоев</th><th>Среднее время</th></tr></thead><tbody>
      ${group.routes.map((route) => `<tr><td>${esc(route.label)}${route.address ? `<small>${esc(route.address)}</small>` : ''}</td><td>${num(route.requests)}</td><td>${num(route.clientErrors)}</td><td>${route.serverErrors ? `<span class="pill bad">${num(route.serverErrors)}</span>` : '0'}</td><td>${num(route.averageMs)} мс${route.slow ? `<small>медленных: ${num(route.slow)}</small>` : ''}</td></tr>`).join('')}
    </tbody></table></div>
  </details>`).join('');
  return `<section class="card" id="requests-card" data-testid="requests-card" style="margin-bottom:14px">
    <h2>Какие запросы идут</h2>
    <p class="muted request-hint">От людей: <b>${num(breakdown.people)}</b> · всего: ${num(breakdown.total)}${breakdown.errors ? ` · <span class="pill bad">сбоев сервера: ${num(breakdown.errors)}</span>` : ' · сбоев нет'}. Отказ — сервер не выполнил запрос по правилам (нет прав, ошибка в форме). Сбой — ошибка на сервере.</p>
    <div class="chart">${requestsChart(breakdown.series)}</div>
    <div class="legend"><span><i style="background:var(--bar)"></i>от людей</span><span><i style="background:var(--soft)"></i>админка, проверки, роботы</span></div>
    ${rows || '<p class="muted">За этот период запросов нет. Разбивка копится с момента обновления сервера и хранится 90 дней.</p>'}
  </section>`;
}

const CENTER_COLUMNS = [
  ['name', 'Центр'], ['status', 'Статус'], ['reachedDepth', 'Дошёл до'], ['usedIn', 'Где работают'], ['activePeople', 'Людей'], ['newCustomers', 'Клиентов'], ['bookings', 'Записей'],
  ['orders', 'Заказов'], ['closed', 'Выдано'], ['changes', 'Действий'], ['createdAt', 'Создан'], ['lastActionAt', 'Последнее действие']
];
const STATUS_ORDER = { active: 0, cooling: 1, gone: 2, idle: 3 };
const CENTER_VIEW_KEY = 'detailflow.admin.centers';
const centerView = { sort: 'lastActionAt', descending: true, search: '', status: '', provider: '', usedIn: '', stuck: false };
try { Object.assign(centerView, JSON.parse(localStorage.getItem(CENTER_VIEW_KEY)) ?? {}); } catch {}
if (!CENTER_COLUMNS.some(([key]) => key === centerView.sort)) centerView.sort = 'lastActionAt';
const keepCenterView = () => { try { localStorage.setItem(CENTER_VIEW_KEY, JSON.stringify(centerView)); } catch {} };
const isManual = (c) => !c.signedUpWith;

/** What is chosen now, sorted. A center that is not counted stays below the counted ones. */
function visibleCenters(list) {
  const search = centerView.search.trim().toLowerCase();
  const shown = list.filter((c) => (!search || c.name.toLowerCase().includes(search))
    && (!centerView.status || (centerView.status === 'skipped' ? c.skipped : !c.skipped && c.status === centerView.status))
    && (!centerView.provider || (centerView.provider === 'manual' ? isManual(c) : centerView.provider === 'app' || centerView.provider === 'site' ? c.origin === centerView.provider : c.signedUpWith === centerView.provider))
    && (!centerView.usedIn || c.usedIn === centerView.usedIn || (c.usedIn === 'both' && centerView.usedIn !== 'both'))
    && (!centerView.stuck || c.customersWithoutBooking > 0));
  const value = (c) => centerView.sort === 'status' ? STATUS_ORDER[c.status] : centerView.sort === 'usedIn' && c.usedIn ? CLIENT_NAMES[c.usedIn] : c[centerView.sort];
  const direction = centerView.descending ? -1 : 1;
  return shown.slice().sort((a, b) => {
    if (a.skipped !== b.skipped) return a.skipped ? 1 : -1;
    const x = value(a), y = value(b);
    // A center with no date yet goes last whichever way the column is sorted.
    if (x == null || y == null) return x == null && y == null ? a.name.localeCompare(b.name, 'ru') : x == null ? 1 : -1;
    const order = typeof x === 'string' ? x.localeCompare(y, 'ru') : x - y;
    return order ? order * direction : a.name.localeCompare(b.name, 'ru');
  });
}

/** One number per cell: the chosen period. All the time is in the tooltip and under the period «Всё время». */
const amount = (value, total) => `<span title="За всё время: ${num(total)}">${num(value)}</span>`;

function usedInCell(c) {
  if (!c.usedIn) return '<span class="muted">—</span>';
  const part = (client) => `${CLIENT_NAMES[client]}: людей ${num(c.clients[client].people)}, действий ${num(c.clients[client].changes)}`;
  return `<span title="${['app', 'site'].filter((client) => c.clients[client].people).map(part).join('; ')}">${CLIENT_NAMES[c.usedIn]}</span>`;
}

function centerRow(c) {
  const fixed = ['tenant_demo', 'tenant_other'].includes(c.id) || c.name === 'Тестовый центр для проверки';
  const looked = c.lastSeenAt && c.lastSeenAt > (c.lastActionAt ?? '') ? `<small>заходил ${when(c.lastSeenAt).split(',')[0]}</small>` : '';
  const how = [c.origin ? CLIENT_NAMES[c.origin] : '', isManual(c) ? 'вручную' : (PROVIDER_NAMES[c.signedUpWith] ?? c.signedUpWith)].filter(Boolean).join(' · ');
  return `<tr class="${c.skipped ? 'skipped' : ''}" data-testid="center-row"><td>
      <b>${esc(c.name)}</b>
      <small class="center-actions"><button class="link" data-center-journal="${esc(c.id)}">журнал</button>${fixed ? '' : `<button class="link" data-center-skip="${esc(c.id)}" data-skip="${c.skipped ? 'false' : 'true'}" data-testid="center-skip">${c.skipped ? 'учитывать' : 'не учитывать'}</button>`}</small>
    </td>
    <td><span class="pill ${c.skipped ? 'soft' : STATUS_TONES[c.status]}" title="${esc(c.statusMeaning)}" data-testid="center-status">${c.skipped ? 'не считается' : esc(c.statusTitle)}</span></td>
    <td data-testid="center-reached" title="Самый дальний шаг за всё время. Услуг: ${num(c.services)}, клиентов: ${num(c.customers)}, записей: ${num(c.allBookings)}, заказов: ${num(c.allOrders)}, выдано: ${num(c.allClosed)}.">${esc(c.reachedTitle)}</td>
    <td data-testid="center-used">${usedInCell(c)}</td>
    <td title="В центре сейчас: ${num(c.members)}">${num(c.activePeople)}</td>
    <td>${amount(c.newCustomers, c.customers)}${c.customersWithoutBooking ? `<small class="stuck" title="Клиент сохраняется на первом шаге записи. Если запись не довели до конца, он остаётся без записи и заказа.">без записи ${num(c.customersWithoutBooking)}</small>` : ''}</td>
    <td>${amount(c.bookings, c.allBookings)}${c.cancelled ? `<small>отменено ${num(c.cancelled)}</small>` : ''}</td>
    <td>${amount(c.orders, c.allOrders)}</td>
    <td title="За всё время: ${num(c.allClosed)}. Актов за период: ${num(c.periodDocuments)}, всего: ${num(c.documents)}">${num(c.closed)}</td>
    <td>${num(c.changes)}</td>
    <td data-testid="center-created">${when(c.createdAt)}<small>${esc(how)}</small></td>
    <td data-testid="center-active">${when(c.lastActionAt)}${looked}</td></tr>`;
}

function centersTable() {
  const shown = visibleCenters(centersAll);
  const box = document.getElementById('centers-table');
  if (!box) return;
  box.innerHTML = `<table><thead><tr>${CENTER_COLUMNS.map(([key, label]) => {
    const active = centerView.sort === key;
    return `<th aria-sort="${active ? (centerView.descending ? 'descending' : 'ascending') : 'none'}"><button class="sort" data-sort="${key}" data-testid="sort-${key}">${label}${active ? (centerView.descending ? ' ↓' : ' ↑') : ''}</button></th>`;
  }).join('')}</tr></thead>
    <tbody>${shown.map(centerRow).join('') || `<tr><td colspan="${CENTER_COLUMNS.length}" class="muted">${centersAll.length ? 'Под этот отбор центров нет.' : 'Центров пока нет.'}</td></tr>`}</tbody></table>`;
  document.getElementById('centers-count').textContent = `Показано: ${num(shown.length)}`;
  box.querySelectorAll('[data-sort]').forEach((button) => button.addEventListener('click', () => {
    const key = button.dataset.sort;
    if (centerView.sort === key) centerView.descending = !centerView.descending;
    else { centerView.sort = key; centerView.descending = !['name', 'status', 'usedIn'].includes(key); }
    keepCenterView();
    centersTable();
  }));
  box.querySelectorAll('[data-center-journal]').forEach((button) => button.addEventListener('click', () => {
    journal.tenant = button.dataset.centerJournal;
    journal.filter = 'all';
    resetJournal();
    showJournal();
  }));
  box.querySelectorAll('[data-center-skip]').forEach((button) => button.addEventListener('click', async () => {
    await api(`/api/admin/centers/${encodeURIComponent(button.dataset.centerSkip)}`, { method: 'PATCH', body: JSON.stringify({ excluded: button.dataset.skip === 'true' }) });
    showDashboard();
  }));
}

function centerFilters() {
  const option = (value, label, chosen) => `<option value="${value}" ${chosen === value ? 'selected' : ''}>${label}</option>`;
  return `<div class="center-filters form" id="center-filters">
    <input type="search" id="center-search" data-testid="center-search" value="${esc(centerView.search)}" placeholder="Название центра" aria-label="Поиск по названию">
    <select id="center-status" data-testid="center-status-filter" aria-label="Статус">${[['', 'Все статусы'], ['active', 'Активные'], ['cooling', 'Притихли'], ['gone', 'Пропали'], ['idle', 'Не начинали'], ['skipped', 'Не считаются']].map(([value, label]) => option(value, label, centerView.status)).join('')}</select>
    <select id="center-provider" data-testid="center-provider" aria-label="Как создан">${[['', 'Создан где угодно'], ['app', 'Создан в приложении'], ['site', 'Создан на сайте'], ['telegram', 'Через Telegram'], ['max', 'Через MAX'], ['email', 'Через email'], ['manual', 'Вручную']].map(([value, label]) => option(value, label, centerView.provider)).join('')}</select>
    <select id="center-used" data-testid="center-used-filter" aria-label="Где работают">${[['', 'Работают где угодно'], ['app', 'В приложении'], ['site', 'На сайте'], ['both', 'И там, и там']].map(([value, label]) => option(value, label, centerView.usedIn)).join('')}</select>
    <label class="check"><input type="checkbox" id="center-stuck" data-testid="center-stuck" ${centerView.stuck ? 'checked' : ''}> Есть клиенты без записи</label>
    <span class="muted" id="centers-count"></span>
  </div>`;
}

function bindCenterFilters() {
  const changed = (key, read) => (event) => { centerView[key] = read(event.target); keepCenterView(); centersTable(); };
  document.getElementById('center-search').addEventListener('input', changed('search', (input) => input.value));
  document.getElementById('center-status').addEventListener('change', changed('status', (input) => input.value));
  document.getElementById('center-provider').addEventListener('change', changed('provider', (input) => input.value));
  document.getElementById('center-used').addEventListener('change', changed('usedIn', (input) => input.value));
  document.getElementById('center-stuck').addEventListener('change', changed('stuck', (input) => input.checked));
  centersTable();
}

function render(stats) {
  const s = stats.system, u = stats.users, now = stats.summary, was = stats.previous, requests = stats.requestBreakdown;
  const load = s.loadAverage[0] / s.cpuCount, memUsed = 1 - s.memory.freeBytes / s.memory.totalBytes, diskUsed = s.disk ? 1 - s.disk.freeBytes / s.disk.totalBytes : 0;
  const statusTotals = Object.entries({ active: 'активны', cooling: 'притихли', gone: 'пропали', idle: 'не начинали' })
    .filter(([status]) => stats.centers.statuses[status]).map(([status, label]) => `<span class="pill ${STATUS_TONES[status]}">${label}: ${num(stats.centers.statuses[status])}</span>`).join(' ');
  const funnel = stats.centers.funnel.map((step) => `<span>${esc(step.title)} <b>${num(step.centers)}</b></span>`).join('<i>·</i>');
  const split = (counts) => ['app', 'site'].filter((client) => counts[client]).map((client) => `${CLIENT_NAMES[client].toLowerCase()} ${num(counts[client])}`).join(', ');
  const line = (...parts) => parts.filter(Boolean).join(' · ');
  app.innerHTML = `
    <header><h1>DetailFlow · Админка<small>Обновлено ${when(stats.generatedAt)} · версия ${esc(stats.version)}</small></h1>${nav('overview')}</header>
    ${periodBar(stats)}
    <section class="grid kpis">
      <div class="card kpi"><span>Центров работали</span><strong>${num(stats.centers.workedInPeriod)}</strong><small>${line(`новых: ${num(now.newCenters)}`, split(now.newCentersIn))}</small></div>
      <div class="card kpi"><span>Людей работали</span><strong>${num(now.activePeople)}</strong><small>${line(split(now.peopleIn), before(now.activePeople, was.activePeople).replace(/^ · /, ''))}</small></div>
      <div class="card kpi"><span>Записей</span><strong>${num(now.bookings)}</strong><small>${now.cancelled ? `отменено ${num(now.cancelled)}` : 'без отмен'}${before(now.bookings, was.bookings)}</small></div>
      <div class="card kpi"><span>Заказов</span><strong>${num(now.orders)}</strong><small>новых клиентов: ${num(now.newCustomers)}${before(now.orders, was.orders)}</small></div>
      <div class="card kpi"><span>Выдано автомобилей</span><strong>${num(now.closed)}</strong><small>актов: ${num(now.documents)}${before(now.closed, was.closed)}</small></div>
      <a class="card kpi kpi-link" href="#requests-card"><span>Запросов от людей</span><strong>${num(requests.people)}</strong><small>${requests.errors ? `<span class="pill bad">сбоев: ${num(requests.errors)}</span>` : 'сбоев нет'} · посмотреть какие →</small></a>
    </section>
    <section class="grid two">
      <div class="card chart"><h2>Активность за период</h2>${activityChart(stats.activity, stats.activityGranularity)}
        <div class="legend">${CHART_SERIES.map(([, label, color]) => `<span><i style="background:${color}"></i>${label}</span>`).join('')}</div></div>
      <div class="card"><h2>Сервер</h2><div class="rows">
        <div><div class="row"><span>Нагрузка (1 мин)</span><b>${s.loadAverage[0].toFixed(2)} на ${s.cpuCount} ядр.</b></div>${meter(load)}</div>
        <div><div class="row"><span>Память</span><b>${bytes(s.memory.totalBytes - s.memory.freeBytes)} из ${bytes(s.memory.totalBytes)}</b></div>${meter(memUsed)}</div>
        ${s.disk ? `<div><div class="row"><span>Диск</span><b>свободно ${bytes(s.disk.freeBytes)} из ${bytes(s.disk.totalBytes)}</b></div>${meter(diskUsed)}</div>` : ''}
        <div class="row"><span>База данных</span><b>${bytes(s.databaseBytes)}</b></div>
        <div class="row"><span>Резервные копии</span><b>${num(s.backups.count)} · последняя ${when(s.backups.latestAt)}</b></div>
        <div class="row"><span>DetailFlow работает</span><b>${duration(s.processUptimeSeconds)}</b></div>
        <div class="row"><span>Сервер включён</span><b>${duration(s.systemUptimeSeconds)}</b></div>
        ${Object.entries(stats.bots).map(([provider, bot]) => `<div class="row"><span>Бот ${provider === 'max' ? 'MAX' : 'Telegram'}</span><b>${bot.status === 'ready' ? '<span class="pill ok">работает</span>' : `<span class="pill bad">недоступен с ${when(bot.downSince)}</span>`}</b></div>`).join('')}
      </div></div>
    </section>
    ${requestsCard(requests)}
    <section class="card" data-testid="centers-card"><h2>Центры · ${num(stats.centers.total)}</h2>
      <p class="request-hint">${statusTotals || '<span class="muted">Центров пока нет.</span>'}</p>
      ${stats.centers.total ? `<p class="funnel" data-testid="center-funnel">${funnel}</p>` : ''}
      ${centerFilters()}
      <div class="table" id="centers-table"></div></section>
    <footer>Статус зависит только от последнего действия в центре: активен до 7 дней, притих до 30, дальше пропал. Открытое приложение само обновляет экраны, поэтому просмотры не считаются действием. «Дошёл до» — самый дальний шаг за всё время, строка над таблицей показывает, сколько центров хоть раз делали каждый шаг. Числа в таблице — за выбранный период, за всё время — в подсказке при наведении. Приложение или сайт определяются по запросам с момента этого обновления, у созданных раньше центров место создания не записано. Клиент сохраняется на первом шаге записи, поэтому «без записи» — это люди, чью запись начали, но не довели до конца или ещё не оформили. Не считаются демо-центры, центр для модераторов магазина и те, что вы отметили «не учитывать». Способы входа: ${u.byProvider.map((p) => `${esc(PROVIDER_NAMES[p.provider] ?? p.provider)} — ${num(p.accounts)}`).join(', ') || 'нет'} · кодов доступа: ${num(u.accessCodes)}. Данные клиентов центров здесь не показываются. Обновляется каждые 30 секунд.</footer>`;
  centersCache = stats.centers.list.map((center) => ({ id: center.id, name: center.name }));
  centersAll = stats.centers.list;
  bindNav();
  bindCenterFilters();
  app.querySelectorAll('[name="period"]').forEach((input) => input.addEventListener('change', () => {
    period = { ...period, preset: input.value };
    keepPeriod();
    if (input.value === 'custom') { document.getElementById('period-dates').hidden = false; return; }
    showDashboard();
  }));
  document.getElementById('period-dates').addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(event.target);
    period = { preset: 'custom', from: String(data.get('from')), to: String(data.get('to')) };
    keepPeriod();
    showDashboard();
  });
  app.querySelectorAll('.request-group').forEach((details) => details.addEventListener('toggle', () => {
    if (details.open) openGroups.add(details.dataset.group); else openGroups.delete(details.dataset.group);
  }));
}

// Tabs: the overview (refreshed every 30 s) and the broadcasts (not refreshed, so a draft is never lost).
function nav(active) {
  return `<nav class="tabs"><button data-tab="overview" class="${active === 'overview' ? 'active' : ''}">Обзор</button><button data-tab="broadcasts" data-testid="tab-broadcasts" class="${active === 'broadcasts' ? 'active' : ''}">Рассылки</button><button data-tab="journal" data-testid="tab-journal" class="${active === 'journal' ? 'active' : ''}">Журнал</button><button id="logout">Выйти</button></nav>`;
}
function bindNav() {
  document.querySelector('[data-tab="overview"]').addEventListener('click', showDashboard);
  document.querySelector('[data-tab="broadcasts"]').addEventListener('click', showBroadcasts);
  document.querySelector('[data-tab="journal"]').addEventListener('click', showJournal);
  document.getElementById('logout').addEventListener('click', async () => { await api('/api/admin/logout', { method: 'POST' }).catch(() => {}); setToken(null); showLogin(); });
}

const KIND_LABELS = { news: 'Новость', update: 'Обновление', survey: 'Опрос' };
const AUDIENCE_LABELS = { all: 'все пользователи', admins: 'владельцы и администраторы', center: 'один центр' };

function readDraft() {
  const form = document.getElementById('broadcast-form');
  const data = new FormData(form);
  const kind = data.get('kind');
  return {
    kind, title: String(data.get('title') ?? '').trim(), body: String(data.get('body') ?? '').trim(),
    audience: data.get('audience'), tenantId: data.get('audience') === 'center' ? data.get('tenantId') : null,
    survey: kind === 'survey' ? { options: String(data.get('options') ?? '').split('\n').map((line) => line.trim()).filter(Boolean), rating: data.get('rating') === 'on', comment: data.get('comment') === 'on' } : null
  };
}

async function showBroadcasts() {
  clearInterval(refreshTimer);
  app.innerHTML = `
    <header><h1>DetailFlow · Рассылки<small>Новости, обновления и опросы для людей центров. Получают только те, у кого включено «Новости и опросы».</small></h1>${nav('broadcasts')}</header>

        <div id="survey-fields" hidden>
          <label>Варианты ответа — каждый с новой строки (можно без них)<textarea name="options" rows="3" placeholder="Удобно&#10;Нормально&#10;Неудобно"></textarea></label>
          <label class="check"><input type="checkbox" name="rating"> Оценка от 1 до 5</label>

        <label id="center-field" hidden>Центр<select name="tenantId">${centersCache.map((center) => `<option value="${esc(center.id)}">${esc(center.name)}</option>`).join('')}</select></label>
        <p class="error" id="broadcast-error"></p>

        ${draft.body ? `<p>${esc(draft.body)}</p>` : ''}
        ${draft.survey ? `<p class="muted">${draft.survey.options.map(esc).join(' · ')}${draft.survey.rating ? ' · оценка 1–5' : ''}${draft.survey.comment ? ' · комментарий' : ''}</p>` : ''}
        <p>Получат: <b>${num(reach.recipients)}</b> чел. в ${num(reach.centers)} центр. — в ленте, копией в мессенджер и на устройство, если включено.</p>

      });
    } catch (error) { errorBox.textContent = error.message; }
  });
  loadList();
}

async function loadList() {
  const box = document.getElementById('broadcast-list');
  try {
    const { items } = await api('/api/admin/broadcasts');
    box.innerHTML = items.length ? `<table><thead><tr><th>Рассылка</th><th>Кому</th><th>Получили</th><th>Прочитали</th><th>Ответили</th></tr></thead><tbody>
      ${items.map((item) => `<tr class="clickable" data-id="${esc(item.id)}" data-testid="broadcast-row"><td>${esc(KIND_LABELS[item.kind])}: ${esc(item.title || item.excerpt)}<small>${when(item.createdAt)}</small></td>
        <td>${esc(item.center ?? AUDIENCE_LABELS[item.audience])}</td><td>${num(item.sent)}</td><td>${num(item.read)}</td><td>${item.kind === 'survey' ? num(item.answers) : '—'}</td></tr>`).join('')}
      </tbody></table>` : '<p class="muted">Рассылок пока не было.</p>';
    box.querySelectorAll('[data-id]').forEach((row) => row.addEventListener('click', () => showResults(row.dataset.id)));
  } catch (error) {
    if (error.status === 401) { setToken(null); showLogin('Сессия закончилась, войдите снова.'); } else box.innerHTML = `<p class="error">${esc(error.message)}</p>`;
  }
}

async function showResults(id) {
  const box = document.getElementById('broadcast-results');
  const result = await api(`/api/admin/broadcasts/${encodeURIComponent(id)}`);
  const bar = (count) => `<div class="meter"><i style="width:${result.answers ? Math.round(count / result.answers * 100) : 0}%"></i></div>`;
  box.innerHTML = `<h2>Результаты</h2><div class="rows" data-testid="broadcast-results">
    <b>${esc(KIND_LABELS[result.kind])}${result.title ? `: ${esc(result.title)}` : ''}</b>${result.title ? '' : `<p class="comment">${esc(result.body)}</p>`}
    <div class="row"><span>Получили</span><b>${num(result.sent)}</b></div>
    ${result.kind === 'survey' ? `<div class="row"><span>Ответили</span><b>${num(result.answers)}</b></div>
      ${result.options.map((option) => `<div><div class="row"><span>${esc(option.label)}</span><b>${num(option.count)}</b></div>${bar(option.count)}</div>`).join('')}
      ${result.survey.rating ? `<div class="row"><span>Средняя оценка</span><b>${result.averageRating ?? '—'}</b></div>
        <div class="row"><span>По оценкам</span><b>${result.ratings.map((item) => `${item.value}★ ${num(item.count)}`).join(' · ')}</b></div>` : ''}
      ${result.comments.length ? `<div><span class="muted">Комментарии</span>${result.comments.map((comment) => `<p class="comment">${esc(comment.text)}<small>${esc(comment.center)} · ${when(comment.at)}</small></p>`).join('')}</div>` : ''}` : `<p class="muted">${esc(result.body)}</p>`}
  </div>`;
}

// The live journal: new entries every 2 s, newest on top, each with what it means. Kept on the server for 90 days.
const LEVEL_LABELS = { info: ['ok', 'событие'], warn: ['warn', 'внимание'], error: ['bad', 'ошибка'] };
const KIND_LABELS_JOURNAL = { action: 'действие', view: 'просмотр', auth: 'вход', bot: 'бот', admin: 'админка', http: 'запрос', server: 'сервер' };
const JOURNAL_FILTERS = {
  all: ['Все', { kinds: 'action,auth,bot,admin,http,server' }],
  actions: ['Действия людей', { kinds: 'action' }],
  views: ['Просмотры разделов', { kinds: 'view' }],
  auth: ['Вход и боты', { kinds: 'auth,bot' }],
  problems: ['Только проблемы', { levels: 'warn,error' }],
  server: ['Сервер', { kinds: 'server,http' }]
};
const journal = { items: [], last: 0, more: false, filter: 'all', tenant: '', client: '', search: '', paused: false, generation: 0 };
function resetJournal() { journal.items = []; journal.last = 0; journal.more = false; journal.generation += 1; }

function journalQuery(extra) {
  const query = new URLSearchParams({ ...JOURNAL_FILTERS[journal.filter][1], ...extra });
  if (journal.tenant) query.set('tenant', journal.tenant);
  if (journal.client) query.set('client', journal.client);
  if (journal.search) query.set('search', journal.search);
  return `/api/admin/events?${query}`;
}

function journalRows() {
  if (!journal.items.length) return `<p class="muted">${journal.search || journal.tenant || journal.client || journal.filter !== 'all' ? 'Под этот отбор записей нет.' : 'Пока тихо. Записи появятся, как только кто-нибудь начнёт вход, что-то изменит в центре или на сервере что-то случится. Журнал хранится 90 дней.'}</p>`;
  const today = new Date().toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
  return journal.items.slice().reverse().map((item) => {
    const [tone, label] = LEVEL_LABELS[item.level] ?? LEVEL_LABELS.info;
    const at = new Date(item.at);
    const day = at.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
    const time = `${day === today ? '' : `${at.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', timeZone: 'Europe/Moscow' })} `}${at.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Moscow' })}`;
    return `<article class="event ${tone}" data-seq="${item.seq}" data-testid="journal-entry">
      <div class="event-head"><time>${time}</time><span class="pill ${tone}">${label}</span><b>${esc(item.title)}</b></div>
      ${item.center || item.actor || item.client ? `<p class="event-who">${[item.center ? `<button class="link" data-event-center="${esc(item.tenantId)}">${esc(item.center)}</button>` : '', esc(item.actor ?? ''), item.client ? `<span data-testid="event-client">${CLIENT_NAMES[item.client] ?? esc(item.client)}</span>` : ''].filter(Boolean).join(' · ')}</p>` : ''}
      ${item.meaning ? `<p class="event-meaning">${esc(item.meaning)}</p>` : ''}
      ${item.detail ? `<details><summary>Технические подробности (${esc(KIND_LABELS_JOURNAL[item.kind] ?? item.kind)})</summary><pre>${esc(item.detail)}</pre></details>` : ''}
    </article>`;
  }).join('');
}

function renderJournal() {
  const box = document.getElementById('journal-list');
  if (!box) return;
  // Opened «Технические подробности» stay open when new entries come.
  const open = new Set([...box.querySelectorAll('details[open]')].map((details) => details.closest('[data-seq]').dataset.seq));
  box.innerHTML = journalRows();
  box.querySelectorAll('[data-seq]').forEach((entry) => { if (open.has(entry.dataset.seq)) entry.querySelector('details')?.setAttribute('open', ''); });
  box.querySelectorAll('[data-event-center]').forEach((button) => button.addEventListener('click', () => {
    journal.tenant = button.dataset.eventCenter;
    document.getElementById('journal-center').value = journal.tenant;
    resetJournal();
    loadJournal();
  }));
  document.getElementById('journal-more').hidden = !journal.more;
  document.getElementById('journal-count').textContent = `Показано: ${num(journal.items.length)} · ${journal.paused ? 'пауза' : 'обновляется каждые 2 с'}`;
}

/** New entries for what is chosen now; a change of filter makes an answer that is on its way useless. */
async function loadJournal() {
  if (journal.paused) return;
  const generation = journal.generation;
  try {
    const fresh = await api(journalQuery({ after: journal.last }));
    if (generation !== journal.generation) return;
    const first = !journal.last;
    if (first) journal.more = fresh.more;
    if (fresh.items.length || first) {
      journal.items = journal.items.concat(fresh.items).slice(-2000);
      journal.last = fresh.last;
      renderJournal();
    } else journal.last = fresh.last;
  } catch (error) { if (error.status === 401) { clearInterval(refreshTimer); setToken(null); showLogin('Сессия закончилась, войдите снова.'); } }
}

async function showJournal() {
  clearInterval(refreshTimer);
  if (!centersCache.length) { try { centersCache = (await api('/api/admin/stats?preset=hour')).centers.list.map((center) => ({ id: center.id, name: center.name })); } catch {} }
  app.innerHTML = `
    <header><h1>DetailFlow · Журнал<small id="journal-count">Загрузка…</small></h1>${nav('journal')}</header>
    <section class="card">
      <div class="journal-bar">
        <div class="segmented">${Object.entries(JOURNAL_FILTERS).map(([value, [label]]) => `<label><input type="radio" name="journal-filter" value="${value}" ${journal.filter === value ? 'checked' : ''}><span>${label}</span></label>`).join('')}</div>
        <button id="journal-pause" data-testid="journal-pause">${journal.paused ? 'Продолжить' : 'Пауза'}</button>
      </div>
      <div class="journal-bar journal-find form">
        <select id="journal-center" data-testid="journal-center" aria-label="Центр"><option value="">Все центры</option>${centersCache.map((center) => `<option value="${esc(center.id)}" ${journal.tenant === center.id ? 'selected' : ''}>${esc(center.name)}</option>`).join('')}</select>
        <select id="journal-client" data-testid="journal-client" aria-label="Откуда">${[['', 'Приложение и сайт'], ['app', 'Только приложение'], ['site', 'Только сайт']].map(([value, label]) => `<option value="${value}" ${journal.client === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
        <input id="journal-search" data-testid="journal-search" type="search" value="${esc(journal.search)}" placeholder="Поиск: заказ, акт, код ошибки…" aria-label="Поиск по журналу">
      </div>
      <p class="muted journal-note">Записывается каждое изменение, вход и сбой; просмотр раздела — раз в 30 минут. Рядом с человеком видно, откуда он работает: приложение или сайт. Данные клиентов, имена, коды входа и токены сюда не попадают: человек показан ролью и коротким номером. Хранится 90 дней.</p>
      <div id="journal-list" class="journal" data-testid="journal-list"></div>
      <button id="journal-more" class="journal-more" data-testid="journal-more" hidden>Показать раньше</button>
    </section>`;
  bindNav();
  const restart = () => { resetJournal(); renderJournal(); loadJournal(); };
  app.querySelectorAll('[name="journal-filter"]').forEach((input) => input.addEventListener('change', () => { journal.filter = input.value; restart(); }));
  document.getElementById('journal-center').addEventListener('change', (event) => { journal.tenant = event.target.value; restart(); });
  document.getElementById('journal-client').addEventListener('change', (event) => { journal.client = event.target.value; restart(); });
  let typing = 0;
  document.getElementById('journal-search').addEventListener('input', (event) => {
    clearTimeout(typing);
    typing = setTimeout(() => { journal.search = event.target.value.trim(); restart(); }, 300);
  });
  document.getElementById('journal-pause').addEventListener('click', (event) => {
    journal.paused = !journal.paused;
    event.target.textContent = journal.paused ? 'Продолжить' : 'Пауза';
    renderJournal();
  });
  document.getElementById('journal-more').addEventListener('click', async () => {
    const older = await api(journalQuery({ before: journal.items[0]?.seq ?? 0 }));
    journal.items = older.items.concat(journal.items);
    journal.more = older.more;
    renderJournal();
  });
  resetJournal();
  renderJournal();
  await loadJournal();
  refreshTimer = setInterval(loadJournal, 2000);
}

async function showDashboard() {
  clearInterval(refreshTimer);
  const load = async () => {
    // Someone choosing dates or typing a name would lose them to a refresh.
    if (document.activeElement?.matches?.('#period-dates input, #center-filters input, #center-filters select')) return;
    try { render(await api(`/api/admin/stats?${periodQuery()}`)); }
    catch (error) { if (error.status === 401) { setToken(null); showLogin('Сессия закончилась, войдите снова.'); } }
  };
  await load();
  refreshTimer = setInterval(load, 30_000);
}

token() ? showDashboard() : showLogin();
</script>
