plugins {
    id 'com.android.application'
}

// Address offered on first launch; set at build time: gradlew assembleDebug -PdetailflowServer=http://192.168.1.10:4173
def defaultServer = (project.findProperty('detailflowServer') ?: '').toString()

// Upload key for Google Play: android/keystore.properties (not in git), see README.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'ru.detailflow.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.detailflow.app'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${defaultServer}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.upload
        }
    }
}
